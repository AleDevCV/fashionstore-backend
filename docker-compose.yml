# =============================================================================
# FASHIONSTORE - ORQUESTACIÓN DE CONTENEDORES
# Sistemas de Información II - UAGRM
# -----------------------------------------------------------------------------
# Levanta dos servicios conectados en una red privada de Docker:
#   db  -> PostgreSQL 16 (ejecuta database/db_scheme.sql en su primer arranque)
#   api -> Backend FastAPI servido por Uvicorn
# -----------------------------------------------------------------------------
# Uso:  docker compose up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # SERVICIO 1: BASE DE DATOS POSTGRESQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fashionstore_db
    restart: unless-stopped

    # Credenciales que la imagen oficial usa para crear el cluster inicial.
    # Se leen del archivo .env para no dejar contraseñas escritas en el compose.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      # Publica el puerto de Postgres hacia Windows para poder inspeccionar la
      # base con pgAdmin o DBeaver desde el host.
      - "${DB_PORT_HOST:-5432}:5432"

    volumes:
      # Volumen nombrado: conserva los datos aunque se borren los contenedores.
      - fashionstore_pgdata:/var/lib/postgresql/data

      # IMPORTANTE: todo script .sql colocado en /docker-entrypoint-initdb.d/ se
      # ejecuta automáticamente, pero SOLO la primera vez que se crea el volumen
      # (cuando el directorio de datos está vacío). Para reejecutar el esquema
      # tras editarlo hay que destruir el volumen: docker compose down -v
      - ./database/db_scheme.sql:/docker-entrypoint-initdb.d/01_db_scheme.sql:ro

    healthcheck:
      # pg_isready confirma que el motor acepta conexiones. La API espera a que
      # este healthcheck pase antes de arrancar (ver depends_on del servicio api).
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - fashionstore_net

  # ---------------------------------------------------------------------------
  # SERVICIO 2: API REST EN FASTAPI
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fashionstore_api
    restart: unless-stopped

    # Carga todas las variables del .env (credenciales, CORS, tamaño del pool).
    env_file:
      - .env

    environment:
      # Sobrescribe DB_HOST del .env: dentro de la red de Docker la base NO está
      # en "localhost" sino en el host virtual "db" (el nombre del servicio).
      # Lo definido en "environment" tiene prioridad sobre "env_file".
      DB_HOST: db
      DB_PORT: 5432

    ports:
      # La API queda accesible desde el navegador de Windows en localhost:8000
      - "${API_PORT_HOST:-8000}:8000"

    depends_on:
      db:
        # No arranca la API hasta que Postgres responda al healthcheck. Evita el
        # error clásico de "connection refused" en el primer arranque.
        condition: service_healthy

    volumes:
      # Monta el código fuente para desarrollo: al editar un archivo .py, el
      # flag --reload reinicia Uvicorn sin reconstruir la imagen.
      - ./app:/code/app

    # Se sobreescribe el CMD del Dockerfile para habilitar autorecarga en desarrollo.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    networks:
      - fashionstore_net

# -----------------------------------------------------------------------------
# RED PRIVADA: aísla los contenedores y permite que la API resuelva el host "db"
# por DNS interno de Docker.
# -----------------------------------------------------------------------------
networks:
  fashionstore_net:
    driver: bridge

# -----------------------------------------------------------------------------
# VOLUMEN PERSISTENTE de los datos de PostgreSQL.
# -----------------------------------------------------------------------------
volumes:
  fashionstore_pgdata:
    name: fashionstore_pgdata
